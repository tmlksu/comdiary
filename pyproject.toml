[project]
name = "comdiary"
# Single source of truth is comdiary.__version__ — two declarations always drift.
dynamic = ["version"]
description = "Docs-as-code ledger for company meetings, chats and mail — with a CLI and a thin MCP server for LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tmlksu" }]
keywords = ["docs-as-code", "living-docs", "meeting-notes", "ledger", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]

# Kept deliberately light so this runs on a low-powered always-on machine (arm64
# single-board computers included). No embeddings, no native wheels — retrieval is
# SQLite FTS5, which ships with CPython.
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "pyyaml>=6",
  "python-frontmatter>=1.1",
  "rich>=13",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
comdiary = "comdiary.cli:main"

[project.urls]
Homepage = "https://github.com/tmlksu/comdiary"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/comdiary/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/comdiary"]

[tool.ruff]
# Roomier than usual: most strings here are Japanese, and ruff counts characters,
# so a 100-char limit wraps prose that reads fine on one line.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.ruff.lint.per-file-ignores]
# typer expresses "repeatable option" as a list default; B006 cannot see that.
"src/comdiary/cli.py" = ["B006"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
